# Despliegue completo: base de datos + FARO.
#   Windows: doble clic en iniciar.bat
#   Otros:   cp .env.example .env (cambiar las claves) && docker compose up -d --build
#   Abrir http://localhost:8082 (el puerto se cambia con FARO_PUERTO en .env)
services:
  bd:
    image: postgres:16
    environment:
      POSTGRES_USER: faro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: faro
    volumes:
      - faro_bd:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faro -d faro"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  faro:
    build: .
    depends_on:
      bd:
        condition: service_healthy
    environment:
      DATABASE_URL: host=bd user=faro password=${POSTGRES_PASSWORD} dbname=faro
      FARO_TOKEN: ${FARO_TOKEN:?defina FARO_TOKEN en .env}
      FARO_SAL: ${FARO_SAL:?defina FARO_SAL en .env}
      FARO_SYNC_HORAS: ${FARO_SYNC_HORAS:-24}
      FARO_HTTPS: ${FARO_HTTPS:-0}
      # Conteos menores que este número no se publican a quien no es analista (0 = sin protección).
      FARO_UMBRAL_CELDA: ${FARO_UMBRAL_CELDA:-3}
      # Servicios de formularios admitidos para la encuesta de campo (separados por coma).
      FARO_FORMULARIOS: ${FARO_FORMULARIOS:-forms.office.com,forms.microsoft.com,forms.cloud.microsoft,forms.office365.us}
    ports:
      # Por omisión solo se atiende en esta máquina. Para abrirlo a la red (detrás de un proxy con
      # TLS), ponga FARO_ESCUCHA=0.0.0.0 en .env.
      - "${FARO_ESCUCHA:-127.0.0.1}:${FARO_PUERTO:-8082}:8080"
    volumes:
      # Salidas fila por fila (sin nombres ni identificadores directos). No se versiona.
      - faro_privado:/app/datos/privado
      # Descargas de fuentes abiertas (INE, OpenStreetMap) con su manifiesto de procedencia.
      - ./datos/crudo:/app/datos/crudo
    restart: unless-stopped

volumes:
  faro_bd:
  faro_privado:
