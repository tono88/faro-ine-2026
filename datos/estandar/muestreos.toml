# Tareas de muestreo automático de precios publicados en tiendas en línea.
# Cada tarea consulta la búsqueda pública del catálogo de una tienda (sin sesión ni claves), una
# vez por término y con pausa entre consultas, y guarda cada precio con su dirección y la fecha.
# Vienen apagadas: se encienden y se les cambia la frecuencia desde la pantalla ("Muestreos").
# Para agregar una tienda con catálogo VTEX basta otra tarea con su dirección base y sus términos.
#
# Seis maneras de leer una tienda (campo `tipo`):
#   vtex           búsqueda pública por términos (`terminos`); pocos productos, muy rápida.
#   vtex-catalogo  recorre el catálogo por categorías (`categorias` = parte del nombre de las de
#                  primer nivel; vacío = todas). Trae código de barras y precio de lista.
#   sitemap        lee el mapa del sitio (`sitemap`) y los datos estructurados (schema.org) de cada
#                  página de producto (`patron` distingue esas páginas; por omisión "/producto/").
#   magento        recorre el listado paginado de productos (`listado`).
#   shopify        catálogo público de la tienda (`/products.json`).
#   woocommerce    API pública de tienda (`/wp-json/wc/store/v1/products`).
# `max_resultados` es el tope de productos por corrida y `max_consultas` el de consultas (400 por
# omisión, 3,000 como máximo). Los supermercados van a tope: todas las categorías y subcategorías.
# Entre una consulta y otra se espera 0.6 s. Solo se leen páginas públicas, sin sesión ni claves.

[[tarea]]
id = "construccion-construfacil"
titulo = "Materiales de construcción en Construfácil"
rubro = "construccion"
tipo = "vtex"
proveedor = "Construfácil"
base = "https://www.construfacil.com.gt"
terminos = ["cemento", "varilla", "block", "lamina", "tubo pvc", "pintura latex", "alambre amarre", "thhn", "tablayeso", "pala", "cal", "piso ceramico", "inodoro"]
cada_horas = 168

