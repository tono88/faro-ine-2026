# Reglas para reconocer, en el texto con que una tienda publica un producto, a qué artículo del
# Índice de Precios de Materiales de Construcción (IPMC, INE) corresponde y cómo llevar su precio
# a la unidad oficial. BORRADOR DEL EQUIPO (24-nov-2026): los artículos y unidades son del INE;
# las palabras, medidas equivalentes y conversiones son propuestas para que las fije la Dirección
# de Índices y Estadísticas Continuas.
#
# requiere: de cada grupo debe aparecer una palabra. excluye: si aparece alguna, no es el artículo.
# medidas: de cada grupo debe aparecer una (in = pulgadas, kg, lb, cal = calibre, chapa, dim =
# dimensiones ordenadas de menor a mayor, ft = pies, m = metros, psi, gal, num = número de cable).
# presentaciones: cómo se lleva el precio publicado a la unidad oficial.
# revisar: característica oficial que el texto no permite comprobar; siempre decide una persona.

[[articulo]]
codigo = 1
requiere = [["angular"]]
excluye = ["esquinero", "ranurado", "aluminio", "plastico", "pvc"]
medidas = [["in:1 1/4"], ["in:1/8"]]
presentaciones = [{ contiene = [] }]

[[articulo]]
codigo = 2
requiere = [["tubo"], ["cuadrado"]]
excluye = ["estructural", "galvanizado", "rectangular"]
medidas = [["in:1"], ["chapa:20"]]
presentaciones = [{ contiene = [] }]

