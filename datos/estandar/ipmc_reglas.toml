codigo = 4
requiere = [["alambre"], ["amarre"]]
excluye = ["galvanizado", "espigado", "puas"]
medidas = [["cal:16", "num:16"]]
presentaciones = [{ contiene = ["quintal", "qq"] }, { contiene = ["libra", "lb", "lbs"], factor = 100.0, nota = "precio por libra × 100" }]

